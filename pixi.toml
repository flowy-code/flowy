[workspace]
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
channels = ["conda-forge"]
name = "flowyenv"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]

[dependencies]
meson = "*"
fmt = "*"
pkg-config = "*"
cmake = "*"
ninja = "*"
cpp-argparse = "*"
clang-format = "18.1.1.*"
tomlplusplus = "*"
catch2 = "*"
xtensor = "<=0.25.0"
xtensor-blas = "*"
cppcheck = "*"
cpplint = "*"
libnetcdf = "*"
hdf5 = "*"
towncrier = "*"
libhwy = ">=1.4.0,<2"
llvm-openmp = ">=22.1.7,<23"
fast_float = ">=8.1.0,<9"

[target.osx-64.dependencies]
cxx-compiler = "==1.10.0"

[target.osx-arm64.dependencies]
cxx-compiler = "==1.10.0"
